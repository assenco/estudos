<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Medidas</title>
    <link rel="stylesheet" href="style.css"></link>
</head>
<body>

    <h1 class="h1">Conversor Polegada para Milímetro</h1>
    <section class="calculator">
        <div><h2>Calculadora de Conversão</h2></div>
        <div id="option">
            <button id="bPol" class="button">Polegada -> mm</button>
            <button id="bMM" class="button">mm -> Polegada</button>
            <button id="bFra" class="button">Fração -> mm</button>
        </div>
        <div id="input">
            <p>Valor em Polegadas</p>
            <input id="inp" class="caixa" type="number" placeholder="Ex: 0.5">
            <button id="bCal" class="caixa">---</button>
        </div>
        <div id="res" class="resultado">
            <p>Resultado</p>
            <p id="out"></p>
            <p id="tMed"></p>
        </div>
    </section>
    <script src="script.js"></script>
</body>
</html>
